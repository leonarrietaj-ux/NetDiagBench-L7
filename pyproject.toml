[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netdiagbench-l7"
version = "1.0.4"
description = "Benchmark reproducible para el diagnóstico de fallas en servicios de capa de aplicación sobre IP con modelos de lenguaje ligeros de ejecución local"
readme = "README.md"
authors = [
    { name = "NetDiagBench-L7 Contributors" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
    "benchmark",
    "network-troubleshooting",
    "slm",
    "llm",
    "dns",
    "http",
    "rag",
    "langgraph",
    "telecommunications"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "Topic :: System :: Networking :: Monitoring",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]

dependencies = [
    # Capa 1 y 2: Formatos, plantillas y preprocesamiento de logs
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.4",
    "drain3>=0.9.11",

    # Capa 3: RAG Léxico Acotado BM25 (<= 0.05 MB RAM)
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",

    # Capa 4: Inferencia Local (Ollama / llama.cpp / HTTP client)
    "ollama>=0.4.0",
    "httpx>=0.27.0",

    # Capa 5: Orquestación Agéntica y Herramientas Read-Only
    "langgraph>=0.2.20",
    "dnspython>=2.6.1",
    "cryptography>=43.0.0",

    # Capa 6: Interfaces CLI y Dashboard Web
    "typer[all]>=0.12.5",
    "rich>=13.7.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "sse-starlette>=2.1.3",

    # Capa 7: Evaluación, Telemetría, Métricas y Exportación
    "psutil>=6.0.0",
    "scipy>=1.13.0",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "scikit-learn>=1.5.0",
    "openpyxl>=3.1.5",
    "reportlab>=5.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0"
]

[project.scripts]
netdiagbench = "src.layer6_interface.cli:app"
benchapp = "src.layer6_interface.cli:app"


[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "emulado: pruebas de laboratorio en contenedores Docker reales (se omiten si Docker no está disponible)"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

