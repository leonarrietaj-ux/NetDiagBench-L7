name: NetDiagBench-L7 CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test Suite & Contracts Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Networking Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dnsutils curl openssl

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -e .

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Verify CLI Commands
        run: |
          python -m src.layer6_interface.cli --help
          python -m src.layer6_interface.cli list-scenarios
          python -m src.layer6_interface.cli list-models

      - name: Execute Statistical Correlation Verification
        run: |
          python -m src.layer6_interface.cli analyze-correlation

      - name: Validate Single Scenario Diagnostic Pipeline
        run: |
          python -m src.layer6_interface.cli run-scenario DNS-NXD-01 --model phi-4-mini-instruct --seed 42 --simulate
