// BIND9 Authoritative Server Configuration
// NetDiagBench-L7: Laboratorio L1
options {
    directory "/var/cache/bind";
    recursion no;
    listen-on { any; };
    listen-on-v6 { any; };
    allow-query { any; };
};

zone "corp.internal" {
    type master;
    file "/etc/bind/zones/db.corp.internal";
};

logging {
    channel auth_log {
        file "/var/log/named/authoritative.log" versions 3 size 20m;
        severity info;
        print-time yes;
        print-category yes;
    };
    category default { auth_log; };
    category queries { auth_log; };
};
