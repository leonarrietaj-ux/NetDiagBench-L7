// BIND9 Recursive Resolver Configuration
// NetDiagBench-L7: Laboratorio L1
options {
    directory "/var/cache/bind";
    recursion yes;
    allow-recursion { any; };
    listen-on { any; };
    listen-on-v6 { any; };
    forwarders {
        // En emulación, apunta hacia bind9-authoritative
        10.0.0.3;
    };
    dnssec-validation no;
    auth-nxdomain no;
};

logging {
    channel default_log {
        file "/var/log/named/query.log" versions 3 size 20m;
        severity info;
        print-time yes;
        print-category yes;
    };
    category queries { default_log; };
    category resolver { default_log; };
};
