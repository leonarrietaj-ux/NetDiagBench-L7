# Nginx Reverse Proxy / API Gateway Configuration
# NetDiagBench-L7: Laboratorio L1

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format netdiag '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log netdiag;
    error_log  /var/log/nginx/error.log warn;

    # Upstream cluster con health-checks pasivos
    upstream backend_cluster {
        server backend-api-1:8000 max_fails=3 fail_timeout=10s;
        server backend-api-2:8000 max_fails=3 fail_timeout=10s backup;
        keepalive 32;
    }

    server {
        listen 80;
        server_name api.corp.internal;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        location /api/v1/ {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /healthz {
            access_log off;
            return 200 "healthy\n";
        }
    }

    # Bloque SSL/TLS
    server {
        listen 443 ssl;
        server_name secure.corp.internal;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
        }
    }
}
