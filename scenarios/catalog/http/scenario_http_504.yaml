scenario_id: "HTTP-504-01"
category: "API_GATEWAY"
fault_class: "HTTP_504_GATEWAY_TIMEOUT"
description: "Nginx Gateway devuelve 504 Gateway Timeout debido a latencia excesiva o bloqueo del backend upstream superando proxy_read_timeout"
injection_script: "scenarios/injectors/http_failures.py"
ground_truth:
  root_cause: "El backend upstream tarda más de 60 segundos en procesar la petición (bloqueo en base de datos o cómputo pesado), excediendo el proxy_read_timeout configurado en Nginx."
  affected_component: "upstream-backend-database"
  suggested_action: "Optimizar la consulta en la base de datos upstream o ajustar los parámetros de proxy_read_timeout y pool de workers."
  minimum_required_evidence:
    - "curl -I -s http://127.0.0.1:80/api/v1/reports -> HTTP/1.1 504 Gateway Time-out"
    - "nginx error.log: '[error] upstream timed out (110: Connection timed out) while reading response header from upstream'"
metadata:
  target_url: "http://127.0.0.1:80/api/v1/reports"
  expected_status_code: 504
  timeout_seconds: 60
