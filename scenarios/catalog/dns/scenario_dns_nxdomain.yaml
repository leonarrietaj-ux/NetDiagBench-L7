scenario_id: "DNS-NXD-01"
category: "DNS"
fault_class: "NXDOMAIN"
description: "Resolución de dominio inexistente o registro no publicado en servidor autoritativo BIND9"
injection_script: "scenarios/injectors/dns_failures.py"
ground_truth:
  root_cause: "Registro de zona faltante o nombre de dominio inexistente en la base de datos de BIND9 (RCODE 3 / NXDOMAIN)"
  affected_component: "bind9-authoritative"
  suggested_action: "Verificar la existencia del registro A/AAAA en el archivo de zona correspondiente o corregir el FQDN consultado."
  minimum_required_evidence:
    - "dig @127.0.0.1 -p 5353 app.internal.corp A -> status: NXDOMAIN, id count: 0"
    - "bind9 query log: 'query: app.internal.corp IN A -E(0)K (127.0.0.1)' result NXDOMAIN"
metadata:
  target_fqdn: "app.internal.corp"
  query_type: "A"
  expected_rcode: "NXDOMAIN"
