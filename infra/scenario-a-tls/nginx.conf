# Escenario A: Nginx con TLS Vencido
events {
    worker_connections 256;
}

http {
    access_log /var/log/nginx/access.log;
    access_log /dev/stdout;
    error_log /var/log/nginx/error.log info;
    error_log /dev/stderr info;

    server {
        listen 443 ssl;
        server_name secure.corp.internal;

        ssl_certificate /etc/nginx/certs/expired.crt;
        ssl_certificate_key /etc/nginx/certs/expired.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            return 200 "[TLS_NEGOTIATED] Host: secure.corp.internal (Certificado expirado)\n";
            add_header Content-Type text/plain;
        }
    }
}
