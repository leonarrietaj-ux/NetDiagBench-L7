# Escenario B: Nginx Gateway con HTTP 502 Bad Gateway (Backend inalcanzable)
events {
    worker_connections 256;
}

http {
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    upstream dead_backend {
        server 127.0.0.1:65530; # Backend intencionalmente inactivo
    }

    server {
        listen 80;
        server_name api.corp.internal;

        location / {
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
            proxy_pass http://dead_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /healthz {
            return 200 "gateway-ok\n";
        }
    }
}
