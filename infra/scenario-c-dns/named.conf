// BIND9 Configuration - Scenario C: SERVFAIL por timeout del autoritativo remoto
// NetDiagBench-L7: Laboratorio en Contenedores (Docker Compose)
options {
    directory "/var/cache/bind";
    listen-on port 53 { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion yes;
    dnssec-validation no;
    auth-nxdomain no;
    resolver-query-timeout 3;
    querylog yes;
};

logging {
    channel default_stderr {
        stderr;
        severity info;
        print-time yes;
        print-category yes;
        print-severity yes;
    };
    channel default_file {
        file "/var/log/bind/default.log" versions 3 size 5m;
        severity info;
        print-time yes;
        print-category yes;
        print-severity yes;
    };
    category default { default_stderr; default_file; };
    category queries { default_stderr; default_file; };
    category resolver { default_stderr; default_file; };
    category query-errors { default_stderr; default_file; };
};

// Zona remota delegada hacia servidor autoritativo inaccesible (RFC 5737 TEST-NET)
// Provoca que BIND9 devuelva RCODE 2 (SERVFAIL) por connection timed out
zone "partner.external.org" IN {
    type forward;
    forward only;
    forwarders { 198.51.100.53; };
};

zone "lab.corp.internal" IN {
    type master;
    file "/etc/bind/zones/db.lab.corp.internal";
};
