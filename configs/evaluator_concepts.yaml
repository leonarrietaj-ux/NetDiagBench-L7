# NetDiagBench-L7: Evaluador de Conceptos Diagnósticos Derivado de Fuentes Oficiales
# Criterios normativos derivados de RFCs IETF, manuales de administración (BIND9 ARM, Nginx Docs) y catálogos de escenarios.
# Versión: 3.0.0 (Auditoría A1/A7: Grupos de términos clave, raíces, sinónimos EN/ES y exclusión de síntomas)
# Regla única de evaluación:
#   is_correct = (cumple >= 1 cause_group) AND (NO concluye clase vecina no-negada en 1ra oración) AND (NO es solo síntoma)

metadata:
  version: "3.0.0"
  description: "Diccionario normativo de grupos de conceptos oficiales con raíces, sinónimos y citas técnicas"
  created_at: "2026-11-01"
  hash_algorithm: "sha256"

classes:
  DELEGATION_ERROR:
    source: "RFC 1034 §4.2, RFC 1035 §3.3.11, catalog scenarios/catalog/dns/scenario_dns_delegation.yaml, knowledge/docs/sop_dns_troubleshooting.md"
    cause_groups:
      - name: "lame_delegation"
        nucleus: ["delegacion", "delegation", "lame", "coja"]
        modifiers: ["defectuosa", "incorrecta", "erronea", "mala", "problema", "coja", "desincroniz*", "server", "servidor", "resolving", "mismatch", "padre", "hija", "parent", "child", "zona"]
      - name: "glue_records"
        nucleus: ["glue record*", "registros de pegamento", "registros pegamento", "glue-record*"]
      - name: "ns_out_of_sync"
        nucleus: ["ns", "servidores ns", "name server*", "servidor delegado", "servidores delegados"]
        modifiers: ["desincroniz*", "desincronizacion", "sin autoridad", "no autoridad", "out of sync", "lame", "no autoritativo", "lack authority"]
    neighbor_concepts:
      - "nxdomain"
      - "rcode 3"
      - "allow-query"
      - "match-clients"
      - "rcode 5"
      - "edns0"
      - "buffer udp 512"
      - "bad gateway"
      - "connection refused"
    symptom_only_terms:
      - "servfail"
      - "rcode 2"
      - "fallo de resolucion"
      - "error de dns"
      - "failed to resolve"
      - "resolution failure"
      - "server failure"

