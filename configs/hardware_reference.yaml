# Plataforma de Referencia (Num. 5.3 y 5.4 de la Tesis)
platform:
  name: "Reference-Workstation-8GB-GPU"
  gpu:
    model: "NVIDIA GeForce RTX (o equivalente ROCm)"
    vram_gb: 8.0
    cuda_compute_capability: ">=7.5"
    driver_version: ">=535.0"
  system_memory:
    ram_gb: 32.0
    reserved_containers_gb: 8.0
    reserved_inference_engine_gb: 16.0
    reserved_os_and_rag_gb: 8.0
  cpu:
    cores: 8
    threads: 16
    instructions: ["AVX2", "FMA"]
  storage:
    type: "NVMe SSD"
    space_gb: 26.0
    breakdown:
      gguf_models_gb: 13.0
      docker_images_gb: 8.0
      corpus_and_results_gb: 5.0
  network:
    lan_isolation: true
    allow_external_internet: false
