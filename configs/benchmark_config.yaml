# Parámetros de la campaña oficial
benchmark:
  name: "NetDiagBench-L7"
  protocol_version: "1.0.4"
  seeds: [42, 1337, 2026]
  repetitions_per_scenario: 1
  temperature: 0.0
  max_decoding_tokens: 1024
  timeout_per_diagnosis_seconds: 900

execution_modes:
  TLS-EXP-01: emulado
  HTTP-502-01: emulado
  DNS-SRV-01: emulado
  default: sintetico_determinista

memory_limits:
  rag_max_memory_gb: 0.45
  max_vram_gb: 8.0

services_under_test:
  dns:
    engine: "BIND9"
    protocols: ["UDP/53", "TCP/53"]
  web:
    engine: "Nginx"
    protocols: ["HTTP/1.1", "HTTP/2", "TLS/1.3"]
  api_gateway:
    engine: "Nginx-API-Gateway"
    protocols: ["REST/JSON"]

evaluation_metrics:
  - "diagnostic_accuracy_full"
  - "diagnostic_accuracy_strict"
  - "root_cause_f1_macro"
  - "time_to_first_token_ms"
  - "inter_token_latency_ms"
  - "total_latency_p50_ms"
  - "total_latency_p95_ms"
  - "declared_model_memory_gb"
  - "peak_ram_gb"
  - "estimated_energy_kwh"
  - "technical_rubric_score"
  - "human_rubric_v3_score"
  - "evidence_backed_rate"

security:
  airgap_mode: false
  min_free_disk_gb: 5.0
  require_api_key_remote: true
